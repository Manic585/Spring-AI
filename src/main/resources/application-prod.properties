# ============================================================
# SERVER
# ============================================================
server.port=${PORT:8080}

# Graceful shutdown — drain in-flight requests before terminating
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Response compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/plain
server.compression.min-response-size=1024

# ============================================================
# TOMCAT THREAD POOL
# ============================================================
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.connection-timeout=5000

# ============================================================
# ERROR RESPONSES
# Never expose stack traces or internal messages to clients
# ============================================================
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ============================================================
# ACTUATOR
# Restrict surface area in production; keep liveness/readiness
# for Kubernetes health probes
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ============================================================
# LOGGING
# Minimal noise in production; use INFO for app, WARN for libraries
# ============================================================
logging.level.root=WARN
logging.level.com.practice.springAI=INFO
logging.level.org.springframework.ai=WARN
logging.level.org.springframework.web=WARN

# Structured JSON logging for log aggregators (Datadog, CloudWatch, ELK)
logging.pattern.console={"timestamp":"%d{yyyy-MM-ddTHH:mm:ss.SSS}","level":"%level","logger":"%logger{36}","thread":"%thread","message":"%msg"}%n

# ============================================================
# SPRING AI RETRY (tighter limits in prod to avoid cascading)
# ============================================================
spring.ai.retry.max-attempts=2
spring.ai.retry.backoff.initial-interval=500
spring.ai.retry.backoff.multiplier=2.0
spring.ai.retry.backoff.max-interval=5000

# ============================================================
# OPENAI (prod model overrides — cost-optimized where possible)
# ============================================================
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.5
spring.ai.openai.image.options.model=dall-e-3
spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.speech.options.model=tts-1

# ============================================================
# FILE UPLOAD
# ============================================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ============================================================
# APP INFO
# ============================================================
info.app.name=Spring AI Demo
info.app.version=1.0.0
info.app.environment=production
