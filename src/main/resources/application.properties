# ── Application ───────────────────────────────────────────────
spring.application.name=springAI
spring.profiles.active=${APP_ENV:prod}

# ── OpenAI ────────────────────────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY}

spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.7

spring.ai.openai.image.options.model=dall-e-3

spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.speech.options.model=tts-1

# ── Retry ─────────────────────────────────────────────────────
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1000
spring.ai.retry.backoff.multiplier=2.0
spring.ai.retry.backoff.max-interval=10000

# ── File upload ───────────────────────────────────────────────
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# ── App info ──────────────────────────────────────────────────
management.info.env.enabled=true
info.app.name=Spring AI Demo
info.app.version=1.0.0
